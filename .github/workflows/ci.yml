name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (errors only)
        run: ruff check .
      - name: every script must at least parse
        run: python -m compileall -q scripts envs tests

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: install headless Mesa/OpenGL stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb \
            libgl1 \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libosmesa6 \
            libosmesa6-dev \
            libgbm1 \
            libglapi-mesa \
            mesa-utils

      - name: configure software rendering for headless CI
        run: |
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe" >> "$GITHUB_ENV"
          echo "MUJOCO_GL=osmesa" >> "$GITHUB_ENV"

      - name: verify MuJoCo can create a headless context
        run: |
          xvfb-run -a python -c "import mujoco; model = mujoco.MjModel.from_xml_string('<mujoco/>'); ctx = mujoco.MjrContext(model, 1000); ctx.free()"

      - name: pytest
        run: |
          xvfb-run -a pytest tests/ -v

  sim-smoke:
    name: mujoco env smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: install headless Mesa/OpenGL stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb \
            libgl1 \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libosmesa6 \
            libosmesa6-dev \
            libgbm1 \
            libglapi-mesa \
            mesa-utils

      - name: configure software rendering for headless CI
        run: |
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe" >> "$GITHUB_ENV"
          echo "MUJOCO_GL=osmesa" >> "$GITHUB_ENV"

      - name: build the env, render the cameras, take a few steps
        run: |
          xvfb-run -a python scripts/verify_manual.py --env single --headless-check

      - name: and the dual-arm rig
        run: |
          xvfb-run -a python scripts/verify_manual.py --env dual --headless-check
