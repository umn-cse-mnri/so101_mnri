name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (errors only)
        run: ruff check .
      - name: every script must at least parse
        run: python -m compileall -q scripts envs tests

  unit:
    name: unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install opencv-python-headless

      - name: install Mesa + OpenGL packages for MuJoCo on Ubuntu 22.04
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb \
            libosmesa6 \
            libosmesa6-dev \
            libgl1-mesa-glx \
            libgl1-mesa-dri \
            libegl1-mesa \
            libgles2-mesa \
            libgl1-mesa-dev \
            mesa-utils

      - name: configure headless MuJoCo backend
        run: |
          echo "MUJOCO_GL=osmesa" >> "$GITHUB_ENV"

      - name: verify MuJoCo can create a headless context
        run: |
          xvfb-run -a env MUJOCO_GL=$MUJOCO_GL python -c "import mujoco; model = mujoco.MjModel.from_xml_string('<mujoco/>'); ctx = mujoco.MjrContext(model, 1000); ctx.free()"

      - name: pytest
        run: |
          xvfb-run -a env MUJOCO_GL=$MUJOCO_GL pytest tests/ -v

  sim-smoke:
    name: mujoco env smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install opencv-python-headless

      - name: install Mesa + OpenGL packages for MuJoCo on Ubuntu 22.04
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb \
            libosmesa6 \
            libosmesa6-dev \
            libgl1-mesa-glx \
            libgl1-mesa-dri \
            libegl1-mesa \
            libgles2-mesa \
            libgl1-mesa-dev \
            mesa-utils

      - name: configure headless MuJoCo backend
        run: |
          echo "MUJOCO_GL=osmesa" >> "$GITHUB_ENV"

      - name: build the env, render the cameras, take a few steps
        run: |
          xvfb-run -a env MUJOCO_GL=$MUJOCO_GL python scripts/verify_manual.py --env single --headless-check

      - name: and the dual-arm rig
        run: |
          xvfb-run -a env MUJOCO_GL=$MUJOCO_GL python scripts/verify_manual.py --env dual --headless-check
