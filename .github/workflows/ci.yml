name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (errors only)
        run: ruff check .
      - name: every script must at least parse
        run: python -m compileall -q scripts envs tests

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: install headless GL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libosmesa6 libosmesa6-dev \
            libegl1 \
            libgl1-mesa-dri \
            xvfb
      - name: verify MuJoCo headless GL backend
        run: |
          export MUJOCO_GL=egl
          xvfb-run -a python -c "import mujoco; model = mujoco.MjModel.from_xml_string('<mujoco/>'); ctx = mujoco.MjrContext(model, 1000); ctx.free()"
      - name: pytest
        run: |
          export MUJOCO_GL=egl
          xvfb-run -a pytest tests/ -v

  sim-smoke:
    name: mujoco env smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: install headless GL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libosmesa6 libosmesa6-dev \
            libegl1 \
            libgl1-mesa-dri \
            xvfb
      - name: verify MuJoCo headless GL backend
        run: |
          export MUJOCO_GL=egl
          xvfb-run -a python -c "import mujoco; model = mujoco.MjModel.from_xml_string('<mujoco/>'); ctx = mujoco.MjrContext(model, 1000); ctx.free()"
      - name: build the env, render the cameras, take a few steps
        run: |
          export MUJOCO_GL=egl
          xvfb-run -a python scripts/verify_manual.py --env single --headless-check
      - name: and the dual-arm rig
        run: |
          export MUJOCO_GL=egl
          xvfb-run -a python scripts/verify_manual.py --env dual --headless-check
