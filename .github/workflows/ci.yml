name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (errors only)
        run: ruff check .
      - name: every script must at least parse
        run: python -m compileall -q scripts envs tests

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: install full Mesa + EGL stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libosmesa6 \
            libosmesa6-dev \
            libegl1 \
            libegl1-mesa \
            libgles2-mesa \
            libgl1-mesa-dri \
            libgl1-mesa-glx \
            xvfb

      - name: pick a working OpenGL backend
        run: |
          for backend in egl osmesa; do
            if xvfb-run -a env MUJOCO_GL=$backend python -c "import mujoco; model = mujoco.MjModel.from_xml_string('<mujoco/>'); ctx = mujoco.MjrContext(model, 1000); ctx.free()"; then
              echo "MUJOCO_GL=$backend" >> "$GITHUB_ENV"
              echo "using $backend"
              exit 0
            fi
          done
          echo "::error::no working OpenGL backend (tried egl and osmesa)"
          exit 1

      - name: pytest
        run: |
          xvfb-run -a env MUJOCO_GL=$MUJOCO_GL pytest tests/ -v

  sim-smoke:
    name: mujoco env smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: install full Mesa + EGL stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libosmesa6 \
            libosmesa6-dev \
            libegl1 \
            libegl1-mesa \
            libgles2-mesa \
            libgl1-mesa-dri \
            libgl1-mesa-glx \
            xvfb

      - name: pick a working OpenGL backend
        run: |
          for backend in egl osmesa; do
            if xvfb-run -a env MUJOCO_GL=$backend python -c "import mujoco; model = mujoco.MjModel.from_xml_string('<mujoco/>'); ctx = mujoco.MjrContext(model, 1000); ctx.free()"; then
              echo "MUJOCO_GL=$backend" >> "$GITHUB_ENV"
              echo "using $backend"
              exit 0
            fi
          done
          echo "::error::no working OpenGL backend (tried egl and osmesa)"
          exit 1

      - name: build the env, render the cameras, take a few steps
        run: |
          xvfb-run -a env MUJOCO_GL=$MUJOCO_GL python scripts/verify_manual.py --env single --headless-check

      - name: and the dual-arm rig
        run: |
          xvfb-run -a env MUJOCO_GL=$MUJOCO_GL python scripts/verify_manual.py --env dual --headless-check
